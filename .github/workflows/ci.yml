name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

# Least privilege: CI only ever reads the repo.
permissions:
  contents: read
  pull-requests: read

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, on every PR and push. Its only job is to answer "what changed?"
  # so the build jobs below can gate on the answer.
  #
  # Why not put `paths:` on the workflow itself? A workflow filtered out that way
  # never reports a status at all, and a required check that never reports blocks
  # the PR forever. A *job* skipped by `if:` does report — as "skipped", which
  # branch protection counts as a pass.
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          # paths-filter diffs against the previous commit on push events,
          # which needs more than the default shallow clone.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'

  client:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version, shared with local dev.
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Separate from the build so a type error reads as a type error.
      # tsc -b is incremental, so `npm run build` re-uses this work.
      - name: Typecheck
        run: npx tsc -b
      - run: npm run build

  server:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # The auth tests talk to a real Postgres rather than a mocked Prisma —
    # the behaviour under test is largely what the database enforces (the
    # unique email index, the user still existing on refresh). This service
    # container is that database. test/globalSetup.ts applies the migrations
    # to it before the first test runs, so no extra step is needed here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meal_planner_test
        ports:
          - 5432:5432
        # Without the health check, `npm test` can start before Postgres is
        # accepting connections and fail intermittently.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Named *_test deliberately: vitest.config.ts refuses to run against a
      # database whose name does not end in _test, so it can never truncate
      # something that matters.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meal_planner_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
